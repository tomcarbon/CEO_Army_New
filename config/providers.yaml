# Generative / model providers the company may use.
#
# Rules
# - No secrets here. Keys live in the environment of whoever runs the adapter.
# - A provider is usable only when `status: approved` and the approval is recorded in
#   records/board/ (the `new-provider` gate). Everything below starts as `candidate`.
# - Compliance & Licensing fills `terms_summary` (path to config/providers/<name>.md) before
#   a provider goes to the board. Cost Analyst keeps `pricing` current with a date.
# - Media roles read `selected` for their medium; if null, they hand off prompt packs to a
#   human instead of calling anything.

selected:
  image: null
  video: null
  music: null
  voice: null
  llm: null        # the model platform the adapters run on; Claude Code today

